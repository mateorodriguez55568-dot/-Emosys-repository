<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #0f0c29;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --estres: #ff416c;
            --relajado: #00f2fe;
            --alegria: #f9d423;
            --text: #ffffff;
            --font-heading: 'Space Grotesk', sans-serif;
            --font-body: 'Poppins', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: var(--text);
            min-height: 100vh;
        }

        header {
            background: rgba(15,12,41,.95);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255,255,255,.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            height: 110px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-img {
            height: 82px;
            width: auto;
            display: block;
            transition: .35s;
            object-fit: contain;
        }

        .logo-img:hover {
            transform: scale(1.05);
        }

        nav ul { display: flex; list-style: none; gap: 30px; }
        nav a { color: white; text-decoration: none; font-family: var(--font-heading); font-size: 0.9rem; font-weight: 700; text-transform: uppercase; }

        .container { padding: 40px 5%; display: flex; flex-direction: column; align-items: center; }

        .monitor-display { 
            background: var(--glass); 
            border: 1px solid var(--glass-border); 
            backdrop-filter: blur(15px); 
            padding: 40px; 
            border-radius: 40px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            width: 100%; 
            max-width: 850px;
        }

        .layout-sensores {
            display: flex;
            gap: 30px;
            width: 100%;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .main-circle {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            transition: all 0.5s ease;
        }

        .main-circle h3 {
            font-size: 16px;
            max-width: 180px;
            margin-top: 10px;
        }

        /* --- Módulo de Video de Cámara --- */
        .camera-box {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            border: 3px solid var(--secondary);
            background: rgba(0,0,0,0.4);
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(58, 123, 213, 0.3);
        }

        .camera-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Modo espejo */
        }

        .camera-overlay {
            position: absolute;
            top: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-family: var(--font-heading);
            color: var(--primary);
            border: 1px solid var(--glass-border);
            z-index: 10;
        }

        .emoji-live { font-size: 70px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; }
        .stat-box { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 20px; border: 1px solid var(--glass-border); text-align: center; }
        .stat-box p { font-size: 0.8rem; font-weight: 700; color: var(--primary); letter-spacing: 2px; margin-bottom: 10px; }
        .stat-val { font-size: 2.5rem; font-family: var(--font-heading); font-weight: 700; }

        #btnConectar {
            margin-top: 20px;
            padding: 12px 28px;
            border-radius: 40px;
            border: none;
            font-family: var(--font-heading);
            letter-spacing: 2px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: white;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0,210,255,0.4);
            transition: 0.3s;
        }

        #btnConectar:hover {
            transform: scale(1.08);
        }

        #btnFinalizar {
            margin-top: 20px;
            padding: 12px 28px;
            border-radius: 40px;
            border: none;
            font-family: var(--font-heading);
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(16,185,129,0.5);
            transition: 0.3s;
        }

        #btnFinalizar:hover {
            transform: scale(1.08);
            box-shadow: 0 0 40px rgba(16,185,129,0.8);
        }

        .botones-monitor {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .user-menu { position: relative; display: inline-block; }
        .user-button { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 10px; }

        .dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 45px;
            background: #15122b;
            width: 220px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,.5);
            overflow: hidden;
            z-index: 1000;
        }

        .dropdown a { display: block; color: white; padding: 15px; text-decoration: none; }
        .dropdown a:hover { background: #3a7bd5; }
        .show { display: block; }
        /* ==========================================================
   ESTILOS RESPONSIVOS UNIVERSALES PARA CELULARES Y TABLETS
   ========================================================== */

/* Asegurar que las tablas no rompan el diseño en pantallas pequeñas */
.table-wrapper {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

/* Ajustes automáticos para pantallas menores a 768px (Celulares) */
@media screen and (max-width: 768px) {
    body {
        padding: 15px 3%; /* Menos espacio en los bordes para aprovechar la pantalla */
    }

    /* Reducir tamaño de títulos grandes */
    h1 {
        font-size: 1.5rem !important;
    }

    /* Convertir la barra de navegación o headers en columna si se amontonan */
    .navbar, .admin-header {
        flex-direction: column;
        align-items: stretch;
        gap: 15px;
        padding: 15px;
    }

    .nav-links {
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
    }

    .header-actions, .tools-bar {
        flex-direction: column;
        width: 100%;
    }

    .search-box {
        min-width: 100%;
    }

    /* Reducir padding de las tarjetas principales en móviles */
    .admin-card {
        padding: 15px;
        border-radius: 15px;
    }

    /* Los formularios en cuadrícula (grid) pasan a una sola columna vertical */
    .form-grid {
        grid-template-columns: 1fr !important;

    /* Ajustar modales para que ocupen casi toda la pantalla del celular sin desbordarse */
    .modal-content {
        width: 95% !important;
        padding: 20px;
        margin: 10px;
    }
}

    <header>
        <a href="/">
            <img src="{{ url_for('static', filename='poster de encabezados-Photoroom.png') }}" alt="Logo" class="logo-img">

        <nav>

                <button id="userButton" class="user-button" onclick="toggleMenu()" style="display:none;">

                <div class="dropdown" id="dropdownMenu">

                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="monitor-display">
            <h2 style="margin-bottom: 25px; font-family: var(--font-heading); text-transform: uppercase; letter-spacing: 3px; color: var(--primary); text-align: center;">
                Monitoreo en Tiempo Real
            </h2>
            
            <div class="layout-sensores">
                <!-- Módulo de visualización del estado IA -->
                <div id="circulo" class="main-circle">
                    <div id="emoji" class="emoji-live">🩺</div>
                    <h3 id="etiqueta">DESCONECTADO</h3>
                </div>

                <!-- Módulo de Cámara Web -->
                <div class="camera-box">
                    <span class="camera-overlay">📹 CÁMARA AI</span>
                    <video id="webcam" autoplay playsinline muted></video>
                </div>
            </div>

            <div class="botones-monitor">
                <button id="btnConectar" onclick="iniciarConexionGlobal()">
                    🔌 CONECTAR ARDUINO Y CÁMARA
                </button>

                    📧 FINALIZAR Y ENVIAR REPORTE
                </button>
            </div>

            <div class="stats-grid" style="margin-top: 30px;">
                <div class="stat-box"><p>PULSO (BPM)</p><div class="stat-val" id="bpm">--</div></div>
                <div class="stat-box"><p>TEMP (°C)</p><div class="stat-val"><span id="val-temp">--</span></div></div>

    </main>

    <audio id="audioFinal" preload="auto">
        <source src="/static/ENVIAR EL REPORTE.mp3" type="audio/mpeg">
    </audio>

<script>
/* ==========================================================================
   1. VARIABLES GLOBALES Y CONFIGURACIÓN DEL DIAGNÓSTICO
   ========================================================================== */
let port;
let reader;
let buffer = "";
let cameraStream = null;

const totalPruebas = 10;
const tiempoPrueba = 10000; 
let pruebaActual = 1;

let datosTemporales = [];   
let resultadosPruebas = []; 

let diagnosticoEnCurso = false;
let diagnosticoCompletado = false;

let timerInterval = null;
let pruebaTimeout = null;
let segundosRestantes = 10;
let tiempoEsperaDedo = null;

let bpmFinal = 0;
let temperaturaFinal = 0;
let emocionFinal = "RELAJADO";

// Referencias DOM
const circulo = document.getElementById('circulo');
const emojiPrincipal = document.getElementById('emoji');
const etiqueta = document.getElementById('etiqueta');
const btnFinalizar = document.getElementById('btnFinalizar');
const videoWebcam = document.getElementById('webcam');


/* ==========================================================================
   2. REGLA LÓGICA DE EMOCIONES (MATRIZ FISIOLÓGICA)
   ========================================================================== */
function evaluarEmocionLocal(bpm, temp) {
    if (bpm >= 111 || temp > 37.0) return "ESTRESADO";
    if (bpm >= 96 && bpm <= 110 && temp >= 36.8 && temp <= 37.3) return "NERVIOSO";
    if (bpm >= 75 && bpm <= 95 && temp >= 36.5 && temp <= 37.0) return "FELIZ";
    if (bpm >= 60 && bpm <= 80 && temp >= 36.3 && temp <= 36.8) return "RELAJADO";
    if (bpm <= 65 && temp <= 36.4) return "CANSADO";

    if (bpm <= 65) return "CANSADO";
    if (bpm <= 80) return "RELAJADO";
    if (bpm <= 95) return "FELIZ";
    if (bpm <= 110) return "NERVIOSO";
    return "ESTRESADO";
}

function normalizarEmocion(emocionRaw, bpm = 0, temp = 0) {
    if (!emocionRaw && bpm > 0) return evaluarEmocionLocal(bpm, temp);
    
    const emo = String(emocionRaw).toUpperCase().trim();

    if (emo.includes("FELIZ") || emo.includes("ALEGRIA")) return "FELIZ";
    if (emo.includes("ESTRES")) return "ESTRESADO";
    if (emo.includes("NERVIO")) return "NERVIOSO";
    if (emo.includes("CANSA")) return "CANSADO";
    if (emo.includes("RELAJ") || emo.includes("NEUTRA") || emo.includes("CALMA")) return "RELAJADO";

    return evaluarEmocionLocal(bpm, temp);
}


/* ==========================================================================
   3. INICIALIZACIÓN CONJUNTA (ARDUINO + CÁMARA)
   ========================================================================== */
async function iniciarConexionGlobal() {
    if (diagnosticoCompletado) {
        alert("El diagnóstico ya fue completado. Recarga la página para iniciar uno nuevo.");
        return;
    }

    etiqueta.innerText = "INICIALIZANDO...";
    etiqueta.style.color = "var(--primary)";

    // 1. Activar Cámara Web en paralelo
    await encenderCamara();

    // 2. Conectar Arduino Web Serial
    await conectarArduino();
}

async function encenderCamara() {
    try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ 
            video: { width: { ideal: 640 }, height: { ideal: 480 } }, 
            audio: false 
        });
        videoWebcam.srcObject = cameraStream;
    } catch (err) {
        console.warn("No se pudo acceder a la cámara:", err);
    }
}

async function conectarArduino() {
    try {
        etiqueta.innerText = "VINCULANDO ARDUINO...";

        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });

        const audio = document.getElementById("audioFinal");
        if (audio) audio.load();

        reader = port.readable.getReader();
        etiqueta.innerText = "COLOQUE EL DEDO";
        
        crearElementosUIProgreso();

        tiempoEsperaDedo = setTimeout(() => {
            if (!diagnosticoEnCurso) {
                etiqueta.innerText = "COLOCAR DEDO";
                etiqueta.style.color = "#ff9800";
            }
        }, 12000);

        leerDatos();

    } catch (error) {
        etiqueta.innerText = "ERROR ARDUINO";
        etiqueta.style.color = "#ff416c";
        console.error("Error al conectar Web Serial:", error);
    }
}

async function leerDatos() {
    const decoder = new TextDecoder();

    try {
        while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value);

            if (buffer.includes("\n")) {
                const lineas = buffer.split("\n");
                buffer = lineas.pop();

                for (let linea of lineas) {
                    if (diagnosticoCompletado) break;
                    procesarLinea(linea.trim());
                }
            }
        }
    } catch (error) {
        console.error("Error leyendo puerto serie:", error);
    }
}


/* ==========================================================================
   4. PROCESAMIENTO DE DATOS SERIALES
   ========================================================================== */
function procesarLinea(linea) {
    if (diagnosticoCompletado || !linea) return;

    if (linea.startsWith("DATOS=")) {
        linea = linea.replace("DATOS=", "LPM=");
    }

    if (linea === "DEDO_DETECTADO") {
        if (tiempoEsperaDedo) clearTimeout(tiempoEsperaDedo);
        etiqueta.innerText = "✔ DEDO DETECTADO";
        etiqueta.style.color = "#2ecc71";
        return;
    }

    if (linea === "INICIANDO DIAGNOSTICO...") {
        etiqueta.innerText = "🩺 ANALIZANDO...";
        etiqueta.style.color = "#00bcd4";
        return;
    }

    let partes = linea.split(";");
    let bpm = null;
    let temp = null;
    let emocionRaw = "";

    partes.forEach(p => {
        if (p.startsWith("LPM=") || p.startsWith("FINAL_LPM=")) {
            bpm = parseInt(p.replace("LPM=", "").replace("FINAL_LPM=", ""));
        }
        if (p.startsWith("TEMP=")) temp = parseFloat(p.replace("TEMP=", ""));
        if (p.startsWith("EMOCION=")) emocionRaw = p.replace("EMOCION=", "").trim();
    });

    if (isNaN(bpm) || isNaN(temp) || bpm === null || temp === null || bpm <= 0) return;

    const emocionValida = normalizarEmocion(emocionRaw, bpm, temp);

    const elBpm = document.getElementById('bpm');
    const elTemp = document.getElementById('val-temp');
    if (elBpm) elBpm.innerText = bpm;
    if (elTemp) elTemp.innerText = temp.toFixed(1);

    actualizarInterfazVisual(emocionValida, `PRUEBA ${pruebaActual}/${totalPruebas}`);

    if (!diagnosticoEnCurso) {
        if (tiempoEsperaDedo) clearTimeout(tiempoEsperaDedo);
        iniciarDiagnostico();
    }

    datosTemporales.push({ bpm: bpm, temperatura: temp, emocion: emocionValida });
}


/* ==========================================================================
   5. CONTROL DEL CICLO DE DIAGNÓSTICO (10 PRUEBAS x 10 SEGUNDOS)
   ========================================================================== */
function iniciarDiagnostico() {
    diagnosticoEnCurso = true;
    iniciarSiguientePrueba();
}

function iniciarSiguientePrueba() {
    datosTemporales = [];
    segundosRestantes = 10;
    actualizarProgresoUI();

    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        segundosRestantes--;
        if (segundosRestantes < 0) segundosRestantes = 0;
        actualizarProgresoUI();
    }, 1000);

    clearTimeout(pruebaTimeout);
    pruebaTimeout = setTimeout(() => {
        finalizarPruebaActual();
    }, tiempoPrueba);
}

function finalizarPruebaActual() {
    clearInterval(timerInterval);

    if (datosTemporales.length === 0) {
        datosTemporales.push({ bpm: 72, temperatura: 36.5, emocion: "RELAJADO" });
    }

    const sumaBpm = datosTemporales.reduce((acc, r) => acc + r.bpm, 0);
    const sumaTemp = datosTemporales.reduce((acc, r) => acc + r.temperatura, 0);

    const promBpm = Math.round(sumaBpm / datosTemporales.length);
    const promTemp = parseFloat((sumaTemp / datosTemporales.length).toFixed(1));

    const conteo = {};
    datosTemporales.forEach(r => conteo[r.emocion] = (conteo[r.emocion] || 0) + 1);
    
    let emocionBloque = "RELAJADO";
    let max = 0;
    for (const [e, c] of Object.entries(conteo)) {
        if (c > max) { max = c; emocionBloque = e; }
    }

    resultadosPruebas.push({
        prueba: pruebaActual,
        bpm: promBpm,
        temperatura: promTemp,
        emocion: emocionBloque
    });

    if (pruebaActual < totalPruebas) {
        pruebaActual++;
        iniciarSiguientePrueba();
    } else {
        calcularDiagnosticoFinal();
    }
}

function calcularDiagnosticoFinal() {
    diagnosticoEnCurso = false;
    diagnosticoCompletado = true;

    const sumaBpmTotal = resultadosPruebas.reduce((acc, r) => acc + r.bpm, 0);
    bpmFinal = Math.round(sumaBpmTotal / totalPruebas);

    const sumaTempTotal = resultadosPruebas.reduce((acc, r) => acc + r.temperatura, 0);
    temperaturaFinal = parseFloat((sumaTempTotal / totalPruebas).toFixed(1));

    emocionFinal = evaluarEmocionLocal(bpmFinal, temperaturaFinal);

    const elBpm = document.getElementById('bpm');
    const elTemp = document.getElementById('val-temp');
    if (elBpm) elBpm.innerText = bpmFinal;
    if (elTemp) elTemp.innerText = temperaturaFinal;

    const infoTexto = document.getElementById('infoPruebaTexto');
    if (infoTexto) infoTexto.innerText = "¡DIAGNÓSTICO COMPLETADO! (10/10)";
    
    const barra = document.getElementById('barraProgresoFill');
    if (barra) barra.style.width = "100%";

    actualizarInterfazVisual(emocionFinal, "RESULTADO: " + emocionFinal);

    apagarCamara();

    if (btnFinalizar) {
        btnFinalizar.disabled = false;
        btnFinalizar.style.opacity = "1";
        btnFinalizar.style.cursor = "pointer";
    }

    if (reader) reader.cancel();

    const audio = document.getElementById("audioFinal");
    if (audio) audio.play().catch(e => console.log("Audio autoplay restringido:", e));
}

function apagarCamara() {
    if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
    }
}


/* ==========================================================================
   6. UI Y RENDERIZADO VISUAL
   ========================================================================== */
function crearElementosUIProgreso() {
    const contenedor = document.querySelector('.monitor-display');
    if (!contenedor || document.getElementById('contenedorProgreso')) return;

    const divProgreso = document.createElement('div');
    divProgreso.id = "contenedorProgreso";
    divProgreso.style.width = "100%";
    divProgreso.style.marginTop = "20px";
    divProgreso.style.textAlign = "center";

    divProgreso.innerHTML = `
        <p id="infoPruebaTexto" style="font-size: 0.9rem; font-weight: 600; color: var(--primary); margin-bottom: 8px;">
            Iniciando prueba...
        </p>
        <div style="width: 100%; background: rgba(255,255,255,0.1); border-radius: 10px; height: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2);">
            <div id="barraProgresoFill" style="width: 0%; height: 100%; background: linear-gradient(90deg, #00f2fe, #4facfe); transition: width 0.3s ease;"></div>
        </div>
    `;

    const referencia = document.querySelector('.botones-monitor');
    if (referencia) {
        contenedor.insertBefore(divProgreso, referencia);
    } else {
        contenedor.appendChild(divProgreso);
    }
}

function actualizarProgresoUI() {
    const infoTexto = document.getElementById('infoPruebaTexto');
    const barra = document.getElementById('barraProgresoFill');
    const segFormateados = segundosRestantes < 10 ? `0${segundosRestantes}` : segundosRestantes;
    
    if (infoTexto) {
        infoTexto.innerText = `Prueba ${pruebaActual}/${totalPruebas} | Tiempo restante: ${segFormateados}s`;
    }

    if (barra) {
        const segundosTotalesTranscurridos = ((pruebaActual - 1) * 10) + (10 - segundosRestantes);
        const porcentaje = (segundosTotalesTranscurridos / 100) * 100;
        barra.style.width = `${porcentaje}%`;
    }
}

function actualizarInterfazVisual(emocion, textoEstado) {
    let color = "#00f2fe";
    let icon = "🧘";
    
    const emocionOficial = normalizarEmocion(emocion);

    switch (emocionOficial) {
        case "RELAJADO": color = "#00f2fe"; icon = "🧘"; break;
        case "FELIZ": color = "#f9d423"; icon = "😄"; break;
        case "NERVIOSO": color = "#ff9800"; icon = "😰"; break;
        case "CANSADO": color = "#9c27b0"; icon = "😴"; break;
        case "ESTRESADO": color = "#ff416c"; icon = "😡"; break;
        default: color = "#00f2fe"; icon = "🧘";
    }

    if (circulo) {
        circulo.style.borderColor = color;
        circulo.style.boxShadow = `0 0 50px ${color}66`;
    }
    if (emojiPrincipal) emojiPrincipal.innerText = icon;
    if (etiqueta) {
        etiqueta.innerText = textoEstado;
        etiqueta.style.color = color;
    }
}


/* ==========================================================================
   7. ENVÍO DE DATOS A FLASK (/api/finalizar_monitoreo)
   ========================================================================== */
async function finalizarMonitoreo() {
    if (!diagnosticoCompletado) {
        alert("Debes esperar a que culminen las 10 pruebas para finalizar el reporte.");
        return;
    }

    const usuario = JSON.parse(localStorage.getItem("usuarioActual"));

    if (!usuario) {
        alert("No se encontró una sesión activa de usuario.");
        return;
    }

    const datosPayload = {
        usuario_id: usuario.id || usuario.usuario_id,
        cedula: usuario.cedula,
        nombre: usuario.nombre,
        email: usuario.email,
        edad: usuario.edad,
        temperatura: temperaturaFinal,
        pulso: bpmFinal,
        emocion: emocionFinal
    };

    try {
        const respuesta = await fetch("/api/finalizar_monitoreo", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datosPayload)
        });

        const resultado = await respuesta.json();

        if (resultado.exito) {
            alert("Reporte final guardado y enviado al correo exitosamente.");
        } else {
            alert("Ocurrió un error al registrar el reporte.");
        }
    } catch (error) {
        console.error("Error al comunicarse con Flask:", error);
        alert("No fue posible establecer conexión con el servidor Flask.");
    }
}


/* ==========================================================================
   8. NAVEGACIÓN Y SESIONES
   ========================================================================== */
function toggleMenu() {
    const dropdown = document.getElementById("dropdownMenu");
    if (dropdown) dropdown.classList.toggle("show");
}

function irLogin() {
    window.location.href = "/login";
}

function cerrarSesion() {
    const idSesion = localStorage.getItem("idSesion");

    if (idSesion) {
        fetch("/api/cerrar_sesion", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ idSesion: idSesion })
        }).catch(err => console.error("Error cerrando sesión:", err));
    }

    localStorage.clear();
    window.location.href = "/";
}

window.onload = function() {
    if (btnFinalizar) {
        btnFinalizar.disabled = true;
        btnFinalizar.style.opacity = "0.4";
        btnFinalizar.style.cursor = "not-allowed";
    }

    const usuario = JSON.parse(localStorage.getItem("usuarioActual"));

    if (usuario) {
        const btnUser = document.getElementById("userButton");
        const btnLogin = document.getElementById("loginButton");
        const lblNombre = document.getElementById("nombreUsuario");

        if (btnUser) btnUser.style.display = "block";
        if (btnLogin) btnLogin.style.display = "none";
        if (lblNombre) lblNombre.innerText = usuario.nombre;

        const rol = usuario.tipo_usuario || usuario.tipoUsuario;
        if (rol !== "Administrador") {
            const adminOpt = document.getElementById("adminOption");
            if (adminOpt) adminOpt.style.display = "none";
        }
    } else {
        const btnUser = document.getElementById("userButton");
        const btnLogin = document.getElementById("loginButton");
        if (btnUser) btnUser.style.display = "none";
        if (btnLogin) btnLogin.style.display = "block";
    }
};
</script>
