<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMOSYS | Registro</title>
    <link rel="icon" href='ChatGPT Image 10 jul 2026, 09_10_26 a.m..png'type="image/png">
    <!-- Se carga desde la carpeta static -->
    <link rel="stylesheet" href="/static/Estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .notificacion-db {
            position: fixed; top: 20px; right: 20px;
            padding: 16px 24px; border-radius: 12px; color: #fff;
            font-family: 'Poppins', sans-serif; font-size: 0.9rem; font-weight: 500;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3); z-index: 9999;
            animation: slideIn 0.4s ease; max-width: 420px;
        }
        .notificacion-db.exito { background: #10b981; }
        .notificacion-db.error { background: #ef4444; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: translateX(0); } }
        #comentario-texto { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: #fff; font-family: 'Poppins', sans-serif; resize: vertical; min-height: 80px; box-sizing: border-box; margin-bottom: 15px;}
        /* ==========================================================
   ESTILOS RESPONSIVOS UNIVERSALES PARA CELULARES Y TABLETS
   ========================================================== */

/* Asegurar que las tablas no rompan el diseño en pantallas pequeñas */
.table-wrapper {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

/* Ajustes automáticos para pantallas menores a 768px (Celulares) */
@media screen and (max-width: 768px) {
    body {
        padding: 15px 3%; /* Menos espacio en los bordes para aprovechar la pantalla */
    }

    /* Reducir tamaño de títulos grandes */
    h1 {
        font-size: 1.5rem !important;
    }

    /* Convertir la barra de navegación o headers en columna si se amontonan */
    .navbar, .admin-header {
        flex-direction: column;
        align-items: stretch;
        gap: 15px;
        padding: 15px;
    }

    .nav-links {
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
    }

    .header-actions, .tools-bar {
        flex-direction: column;
        width: 100%;
    }

    .search-box {
        min-width: 100%;
    }

    /* Reducir padding de las tarjetas principales en móviles */
    .admin-card {
        padding: 15px;
        border-radius: 15px;
    }

    /* Los formularios en cuadrícula (grid) pasan a una sola columna vertical */
    .form-grid {
        grid-template-columns: 1fr !important;
    }

    /* Ajustar modales para que ocupen casi toda la pantalla del celular sin desbordarse */
    .modal-content {
        width: 95% !important;
        padding: 20px;
        margin: 10px;
    }
}
    </style>
</head>
<body>

<header>
    <a href="/">
        <img src="{{ url_for('static', filename='poster de encabezados-Photoroom.png') }}" alt="EMOSYS Logo" class="logo-img">
    </a>
    <nav>
        <ul>
            <li><a href="/">Inicio</a></li>
        </ul>
        <div id="controles-historial" style="text-align: center; margin-top: 15px;">
        </div>
    </nav>
</header>

    <section class="container">
        <div class="registro-card">
            <h2>Registro de Usuario</h2>
            <p>Ingresa tus datos para iniciar la vinculación con EMOSYS</p>
            
            <form id="form-registro">
    <div class="input-group">
        <label for="cedula">Cédula</label>
        <input type="text" id="cedula" name="cedula" placeholder="Ej. 1712345678" required>
    </div>
    <div class="input-group">
        <label for="nombres">Nombres y apellidos</label>
        <input type="text" id="nombres" name="nombres" placeholder="Ej. Andy Sosa" required>
    </div>
    <div class="row">
        <div class="input-group">
            <label for="edad">Edad</label>
            <input type="number" id="edad" name="edad" placeholder="Ej. 18" min="1" max="120" required>
        </div>
    </div>
    <div class="input-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="Ej. andy.sosa@correo.com" required>
    </div>
    <div class="input-group">
        <label for="tipo-usuario">Tipo de usuario</label>
        <select id="tipo-usuario" name="tipo_usuario" required>
            <option value="" disabled selected>Seleccione una opción</option>
            <option value="Estudiante">Estudiante</option>
            <option value="Docente">Docente</option>
            <option value="Administrativo">Administrativo</option>
            <option value="Otro">Otro</option>
        </select>
    </div>
    <button type="submit" class="btn-glow">Empezar Monitoreo</button>
</form>
        </div>

        <div id="historial-global" class="history-card">
            <h3>👥 Últimos Registros</h3>
            <ul id="lista-global-usuarios"></ul>
            <div id="controles-historial">
                <button id="btn-mostrar-mas" class="btn-toggle" style="display: none;" onclick="verMas()">🔽 Ver todos los registros</button>
                <button id="btn-volver" class="btn-toggle" style="display: none;" onclick="volverAlInicio()">⬆️ Ocultar antiguos</button>
            </div>
            <button onclick="limpiarHistorial()" class="btn-borrar" style="margin-top: 20px;">🗑️ Limpiar Historial</button>
        </div>  

        <div class="history-card" style="margin-top: 30px;">
    <h3>💬 Comentarios</h3>
    <form id="form-comentario">
        <div class="input-group">
            <label for="comentario-nombre">Tu nombre</label>
            <!-- Se agrega readonly para que el usuario no pueda editarlo manualmente -->
            <input type="text" id="comentario-nombre" name="nombre" placeholder="Regístrate arriba primero..." readonly required>
        </div>
        <div class="input-group">
            <label for="comentario-texto">Escribe tu comentario</label>
            <textarea id="comentario-texto" name="comentario" placeholder="¿Qué opinas?" required></textarea>
        </div>
        <button type="submit" class="btn-glow">Enviar Comentario</button>
    </form>
    <ul id="lista-comentarios" style="margin-top: 20px; padding: 0;"></ul>
</div>
    </section>

    <!-- Se carga desde la carpeta static -->
    <script src="/static/Script.js"></script>
</body>
</html>
